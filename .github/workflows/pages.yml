name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "llms.txt"
      - "llms-full.txt"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 5 * * *" # refresh PyPI download counts daily
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp llms.txt _site/llms.txt
          cp llms-full.txt _site/llms-full.txt
          touch _site/.nojekyll

      - name: Fetch PyPI download counts
        # Primary source: the pepy.tech lifetime total. The pepy.tech API needs
        # the PEPY_API_KEY repository secret. Without the secret, or when the
        # call fails, the step uses the alternative source.
        # Alternative source: pypistats.org. It keeps only 180 days, so the
        # total is a fixed BigQuery count (pypi.file_downloads, all downloads
        # up to BASELINE_END) plus the pypistats with_mirrors counts after
        # that date. The last_month and last_week fields come from pypistats.
        # Neither API sends CORS headers, so the browser reads downloads.json.
        # Failure is not fatal: the site hides the stat when the file is missing.
        continue-on-error: true
        env:
          BASELINE_TOTAL: "3538"
          BASELINE_END: "2026-09-30"
          PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }}
        run: |
          pepy_total=null
          if [ -n "$PEPY_API_KEY" ] && curl -fsS --retry 3 --max-time 30 \
              -H "X-API-Key: $PEPY_API_KEY" \
              https://api.pepy.tech/api/v2/projects/nexus-mcp-ci -o pepy.json; then
            pepy_total=$(jq '.total_downloads // null' pepy.json || echo null)
          fi
          curl -fsS --retry 3 --max-time 30 \
            https://pypistats.org/api/packages/nexus-mcp-ci/overall -o overall.json \
            || echo '{"data": null}' > overall.json
          curl -fsS --retry 3 --max-time 30 \
            https://pypistats.org/api/packages/nexus-mcp-ci/recent -o recent.json \
            || echo '{"data": {}}' > recent.json
          jq -n --slurpfile o overall.json --slurpfile r recent.json \
            --argjson pepy "$pepy_total" \
            --argjson base "$BASELINE_TOTAL" --arg end "$BASELINE_END" '
            (if $o[0].data != null
             then $base + ($o[0].data | map(select(.category == "with_mirrors" and .date > $end) | .downloads) | add // 0)
             else null end) as $pypi
            | if ($pepy // $pypi) == null then error("no download source") else . end
            | {total: ($pepy // $pypi), source: (if $pepy != null then "pepy.tech" else "pypistats.org" end),
               pypistats_total: $pypi,
               last_month: $r[0].data.last_month, last_week: $r[0].data.last_week, updated: (now | todate)}' \
            > _site/downloads.json || rm -f _site/downloads.json
          # Shields.io endpoint for the alternative (pypistats) README badge.
          # The primary README badge comes from static.pepy.tech directly.
          if [ -f _site/downloads.json ] && jq -e '.pypistats_total != null' _site/downloads.json > /dev/null; then
            jq '{schemaVersion: 1, label: "downloads", message: ((.pypistats_total | tostring) + " total"), color: "blue"}' \
              _site/downloads.json > _site/downloads-badge.json
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
