name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Published benchmark numbers are current
        run: uv run python scripts/publish_results.py --check

      # argparse help text differs between Python versions, so check on one.
      - name: CLI reference is current
        if: matrix.python-version == '3.12'
        run: uv run python scripts/gen_cli_docs.py --check

      - name: Test
        run: uv run pytest -v -m "not slow"
