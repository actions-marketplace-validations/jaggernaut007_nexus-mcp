name: CI

on:
  push:
    branches: [main]
  # Every PR, not only PRs into main: stacked PRs target each other's branches.
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Published benchmark numbers are current
        run: uv run python scripts/publish_results.py --check

      # Versions, tool counts, the docs index, CONFIGURATION.md and (on 3.12) CLI.md.
      - name: Docs match the code
        run: uv run python scripts/check_docs.py

      - name: Test
        run: uv run pytest -v -m "not slow"

  links:
    name: Links in the docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Offline: checks links to files in this repo, so the job never fails on a slow site.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress --include-fragments
            --exclude-path docs/research --exclude-path docs/plans
            --exclude 'llms(-full)?\.txt$'
            README.md CONTRIBUTING.md SECURITY.md 'docs/**/*.md'
            site/index.html site/benchmarks.html
          fail: true
