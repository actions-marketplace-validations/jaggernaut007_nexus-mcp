name: nexus-mcp
image: mcp/nexus-mcp
type: server
meta:
  category: code
  tags:
    - code
    - search
    - code-graph
    - developer-tools
about:
  title: Nexus-MCP
  description: Local code search and call graph for AI coding agents. Hybrid search, the code of any symbol, and callers and callees for 10 languages, so the agent reads fewer files. No API key and no telemetry.
  icon: https://raw.githubusercontent.com/jaggernaut007/Nexus-MCP/main/site/logo-400.png
source:
  project: https://github.com/jaggernaut007/Nexus-MCP
  commit: 76379119f2eaf2484098b11a42f80c31e5f97aea
  dockerfile: docker/Dockerfile.stdio
run:
  volumes:
    - "{{nexus-mcp.path|volume-target}}:/workspace"
    - nexus-mcp-data:/data
config:
  description: The project folder that Nexus-MCP indexes. It is mounted at /workspace. The index and the embedding model stay in the nexus-mcp-data volume.
  parameters:
    type: object
    properties:
      path:
        type: string
        default: /Users/demo/sources
    required:
      - path
